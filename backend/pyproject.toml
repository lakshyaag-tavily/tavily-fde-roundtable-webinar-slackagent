[project]
name = "roundtable-agent-backend"
version = "0.1.0"
description = "Generic Tavily-powered Deep Agent for Slack."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer>=0.15.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "langchain>=1.3.15",
  "langchain-openai>=0.3.0",
  "langchain-tavily>=0.2.18",
  "langgraph>=1.1.10",
  "deepagents>=0.7.0",
  "slack-sdk>=3.33.0",
  "slack-bolt>=1.21.0",
]

[project.scripts]
roundtable-agent = "roundtable_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roundtable_agent"]
